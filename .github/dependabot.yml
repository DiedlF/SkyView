# Weekly dependency update pull requests. CI runs the tests on each one;
# merging deploys it (see docs/UPDATES.md).
version: 2
updates:
  # Python: pip-tools layout. requirements.in = direct dependencies,
  # requirements.txt = lock compiled by pip-compile. Dependabot re-runs
  # pip-compile, so every PR is a consistent, fully resolved set.
  #
  # One entry per environment on purpose: a group spanning both directories
  # forces one version of a package into both (it once downgraded the ingest
  # environment's zarr 3 to the web app's zarr 2).
  - package-ecosystem: pip
    directory: "/backend"
    schedule: &weekly
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      # All minor/patch bumps in one PR; major versions arrive as separate
      # PRs so they can be reviewed on their own.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The web app reads ICON data stored in the zarr v2 format with
      # zarr 2.17 / numcodecs 0.12 (deliberate pins in requirements.in).
      # Changing them needs a data-compatibility check first.
      - dependency-name: "zarr"
      - dependency-name: "numcodecs"
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: pip
    directory: "/backend/observations"
    schedule: *weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(ingest)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
