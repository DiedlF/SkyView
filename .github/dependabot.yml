# Weekly dependency update pull requests. CI runs the tests on each one;
# merging deploys it (see docs/UPDATES.md).
version: 2
updates:
  # Python: pip-tools layout. requirements.in = direct dependencies,
  # requirements.txt = lock compiled by pip-compile. Dependabot re-runs
  # pip-compile, so every PR is a consistent, fully resolved set.
  - package-ecosystem: pip
    directories:
      - "/backend"
      - "/backend/observations"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      # One PR per directory for all minor/patch bumps; major versions
      # arrive as separate PRs so they can be reviewed on their own.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The web app reads ICON data stored in the zarr v2 format; zarr 3 and
      # newer numcodecs need a data migration first (see backend/requirements.in).
      - dependency-name: "zarr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numcodecs"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
